name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter doctor
      - run: flutter pub get
      - run: flutter test
